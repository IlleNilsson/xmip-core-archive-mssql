# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-archive-mssql"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-archive-mssql"
description = "SQL Server archive target: one item is one row of an archive table. A xmip-core-archive technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The ArchiveStore trait and its types live there.
archive = { package = "xmip-core-archive", git = "https://github.com/IlleNilsson/xmip-core-archive", branch = "main" }
# The connection: the sibling transport technology's Client speaks TDS with
# SQL Server authentication, and its Session is the far end a test binds.
mssql = { package = "xmip-core-transport-mssql", git = "https://github.com/IlleNilsson/xmip-core-transport-mssql", branch = "main" }

[dev-dependencies]
# The tests archive the capability's fixture item (ADR-0044); the feature
# is enabled here so it is never part of a production build.
archive = { package = "xmip-core-archive", git = "https://github.com/IlleNilsson/xmip-core-archive", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
